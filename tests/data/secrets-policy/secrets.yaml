# Test fixture: an example credential-path deny list, the shape an estate's
# policies/secrets.yaml takes. The secret-path tests run against it
# (tests/test_vpsexec.py SECRETS_POLICY).
#
# Credential paths vpsexec will not touch, on any host, by any tier. Without
# this list `cat /opt/app/.env.production` classifies as a READ: no --run, no
# --reason, no approval, and it works on frozen hosts.
#
# deny_extra is ABSOLUTE. Like the deny-always floor, nothing lifts it: not a
# runbook, not --override, not --break-glass, not an approval.
#
# Matching is case-insensitive substring over the whole whitespace-collapsed
# command line, so this also catches the path appearing mid-pipeline.

version: 1
reason: "Credential paths are not readable through this door"

deny_extra:
  # Application environment.
  - ".env.production"
  - ".env.local"
  - "env.production"

  # SSH and TLS private material, and kubeconfigs (an embedded client cert and
  # key or a bearer token; the k3s admin kubeconfig is root on the cluster).
  - "id_rsa"
  - "id_ed25519"
  - "k3s.yaml"
  - ".kube/config"
  - "kubeconfig"
  - "id_ecdsa"
  - "private_key"
  - "PRIVATE KEY"
  - ".pem"

  # Credential stores.
  - ".pgpass"
  - "vpscfgfarm/telemetry-key"
  - ".aws/credentials"
  - ".docker/config.json"
  - "htpasswd"
  - "VAULT_TOKEN"
  - "vault token"
  # A TLS server key and Traefik's ACME store (every key Traefik has issued).
  - "server.key"
  - "acme.json"
  # An inventory host agent's per-host key.
  - "inventory-agent/key"

  # hsmd, an HSM daemon: /etc/hsmd/pin is the HSM user PIN,
  # /etc/hsmd/share-N.wrapped a wrapped Vault unseal share, and the SoftHSM
  # token store under /var/lib/softhsm/tokens the wrapping key, encrypted
  # under that PIN.
  #   "/etc/hsmd"     the directory itself: `cd /etc/hsmd && cat pin`
  #   "hsmd/"         any spelling of a path under it (also /run/hsmd)
  #   ".wrapped"      the share files by suffix, from whatever directory
  # Bare "hsmd" is NOT listed on purpose: `systemctl is-active hsmd` and
  # `journalctl -u hsmd` are reads; deny the paths, not the unit.
  - "/etc/hsmd"
  - "hsmd/"
  - ".wrapped"
  - "HSMD_PIN"
  - "HSMD_DEV_KEY"
  # Bare "softhsm": the token store, its config, softhsm2-util and the module.
  - "softhsm"
  # PKCS#11 clients log in with the PIN and can list or export token objects.
  - "pkcs11-tool"
  - "p11tool"

  # Vault init output and tokens (unseal_keys_b64 + root_token), and the
  # Vault CLI's cached token.
  - "vault-init"
  - "vault-root"
  - "unseal_keys"
  - "root_token"
  - ".vault-token"

  # Password hashes. "/shadow" rather than "/etc/shadow": it also catches
  # /etc//shadow, /etc/./shadow, /etc/shadow- and /proc/1/root/etc/shadow.
  - "/shadow"
  - "gshadow"
  # Postfix relay credentials (and the .db postmap builds from them).
  - "sasl_passwd"
  # MySQL client credentials. (".my.cnf" does not match /etc/mysql/my.cnf.)
  - ".my.cnf"
  - "debian.cnf"
  # Shell and client histories: passwords typed on a command line.
  - "bash_history"
  - "zsh_history"
  - "psql_history"
  - "mysql_history"
  - "rediscli_history"
  - "python_history"
  # k3s server: the join token, its TLS keys, the credential directory's
  # files and the datastore. Narrow on purpose, so a find that prints only
  # modes (`-name 'node-token'`) stays a read.
  - "k3s/server/token"
  - "server/node-token"
  - "k3s/server/tls"
  - "k3s/server/db"
  - "cred/passwd"
  - "node-passwd"
  - "ipsec.psk"
  # k3s server config (holds the join token when set there).
  - "k3s/config.yaml"
  # Docker container config: the container's full environment.
  - "config.v2.json"
  # Mounted secrets: Docker/compose secrets and a pod's service-account token.
  - "run/secrets/"
  - "serviceaccount/token"
  # WireGuard private keys; Vault server config and TLS keys.
  - "wireguard/"
  - "vault.d/"
  # Client credentials and old password hashes.
  - ".netrc"
  - "opasswd"
  - "rclone.conf"

# Service NAMES are not listed: denying a service name would block reading its
# logs during an incident. Deny the credential PATHS.

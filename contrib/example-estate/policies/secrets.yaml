# Credential paths vpsexec will not touch — on any host, by any tier, ever.
#
# WHY THIS EXISTS: `cat /srv/shop/.env.production` classifies as a READ.
# Reads need no --run, no --reason and no approval, and they work on frozen
# hosts. Without this file, `vpsexec @all 'cat /srv/shop/.env.production'`
# would print every host's credentials to a terminal.
#
# deny_extra is ABSOLUTE. Like the deny-always floor, nothing lifts it: not a
# runbook, not --override, not --break-glass, not an approval. If you need to
# read one of these, do it yourself with the plan in front of you. Removing a
# line here is a reviewed commit, and should be rare enough to be memorable.
#
# Matching is case-insensitive substring over the whole whitespace-collapsed
# command line, so this also catches the path appearing mid-pipeline. Deny the
# credential PATHS, not service NAMES: a service called "secrets-api" must
# still be readable with `docker logs` during an incident.
#
# Some credential files cannot be matched precisely by a substring; those are
# matched by NAME in vpscfg/readpolicy.py on every tier (ssh host keys, *.key,
# .env files, raw devices and /proc/<pid>/environ). This list is the rest.

version: 1
reason: "Credential paths are not readable through this door"

deny_extra:
  # Application environment: the host files a contract's sync.never protects.
  - ".env.production"
  - ".env.local"
  - "env.production"

  # SSH and TLS private material.
  - "id_rsa"
  - "id_ed25519"
  - "id_ecdsa"
  - "private_key"
  - "PRIVATE KEY"
  - ".pem"
  - "server.key"
  # A reverse proxy's ACME store holds every private key it has issued.
  - "acme.json"

  # Kubeconfigs carry a client cert+key or bearer token.
  - "k3s.yaml"
  - ".kube/config"
  - "kubeconfig"

  # Credential stores and tokens.
  - ".pgpass"
  - ".aws/credentials"
  - ".docker/config.json"
  - "htpasswd"
  - ".netrc"
  - "rclone.conf"
  - "VAULT_TOKEN"
  - "vault token"
  - ".vault-token"
  - "unseal_keys"
  - "root_token"

  # Password hashes. "/shadow" also catches /etc//shadow, /etc/shadow- and
  # /proc/1/root/etc/shadow.
  - "/shadow"
  - "gshadow"
  - "opasswd"

  # Mail relay and database client credentials.
  - "sasl_passwd"
  - ".my.cnf"
  - "debian.cnf"

  # Shell and client histories: passwords typed on a command line.
  - "bash_history"
  - "zsh_history"
  - "psql_history"
  - "mysql_history"
  - "rediscli_history"
  - "python_history"

  # k3s server secrets: join token, TLS keys, datastore, credentials.
  - "k3s/server/token"
  - "server/node-token"
  - "k3s/server/tls"
  - "k3s/server/db"
  - "cred/passwd"
  - "node-passwd"
  - "k3s/config.yaml"

  # Container secrets: the full environment, mounted secrets, SA tokens.
  - "config.v2.json"
  - "run/secrets/"
  - "serviceaccount/token"

  # VPN and secret-store server material.
  - "wireguard/"
  - "ipsec.psk"
  - "vault.d/"
